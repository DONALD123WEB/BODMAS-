<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - BODMAS Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">


    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl p-6">


        <h1 class="text-white text-3xl font-bold text-center mb-2">
            BODMAS Calculator
        </h1>


        <p class="text-gray-400 text-center mb-6">
            Login to continue
        </p>


        <form id="loginForm">


            <!-- Email -->

            <div class="mb-4">

                <label class="text-gray-300 block mb-2">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    placeholder="Enter your email"
                    class="w-full p-3 rounded-lg bg-gray-700 text-white outline-none"
                >

            </div>


            <!-- Password -->

            <div class="mb-4">

                <label class="text-gray-300 block mb-2">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    required
                    placeholder="Enter your password"
                    class="w-full p-3 rounded-lg bg-gray-700 text-white outline-none"
                >

            </div>


            <!-- Error message -->

            <div
                id="errorMessage"
                class="hidden bg-red-600 text-white p-3 rounded-lg mb-4"
            ></div>


            <!-- Login button -->

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg"
            >
                Login
            </button>


        </form>


        <p class="text-gray-400 text-center mt-6">

            Don't have an account?

            <a
                href="register.html"
                class="text-blue-400 hover:text-blue-300"
            >
                Create Account
            </a>

        </p>


    </div>


    <script type="module">

        import { auth } from "./firebase-config.js";


        import {
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        const loginForm =
            document.getElementById("loginForm");


        const errorMessage =
            document.getElementById("errorMessage");


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                errorMessage.classList.add(
                    "hidden"
                );


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                try {


                    // Login user

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    // Login successful

                    window.location.href =
                        "calculator.html";


                }
                catch (error) {

                    console.error(error);


                    errorMessage.textContent =
                        "Invalid email or password.";


                    errorMessage.classList.remove(
                        "hidden"
                    );

                }

            }
        );

    </script>


</body>

</html>
